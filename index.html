<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jarvis</title>
<script src="https://js.puter.com/v2/"></script>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#050A10" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050A10; --panel: #0B1520; --panel-alt: #081019; --border: #17293A;
    --amber: #4FC3F7; --amber-dim: #1D5A73; --cyan: #8FE3FF; --cyan-dim: #2C6E85;
    --text: #E7F5FF; --muted: #6C8CA3; --danger: #FF5A5A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(ellipse at top, #0C1B28 0%, var(--bg) 55%);
    color: var(--text); font-family: 'Inter', sans-serif;
    min-height: 100vh; padding: 16px 12px 32px;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  ::placeholder { color: var(--muted); }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .header { display: flex; flex-direction: column; gap: 10px; }
  .header-top { display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; }
  .header-icons { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .header-time-row { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .orb-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
  .orb-ring1, .orb-ring2 { position: absolute; border-radius: 50%; border: 1px solid var(--amber); }
  .orb-ring1 { inset: 0; opacity: .35; animation: spin 14s linear infinite; }
  .orb-ring2 { inset: 8px; opacity: .5; }
  .orb-core { position: absolute; inset: 15px; border-radius: 50%; background: radial-gradient(circle, var(--amber) 0%, transparent 75%); box-shadow: 0 0 16px 2px rgba(232,163,61,.5); animation: pulse 3s ease-in-out infinite; }
  .orb-wrap.listening .orb-ring1, .orb-wrap.listening .orb-ring2, .orb-wrap.speaking .orb-ring1, .orb-wrap.speaking .orb-ring2 { border-color: var(--cyan); animation-duration: 2s; }
  .orb-wrap.listening .orb-core, .orb-wrap.speaking .orb-core { background: radial-gradient(circle, var(--cyan) 0%, transparent 75%); box-shadow: 0 0 16px 2px rgba(79,217,199,.5); animation-duration: 1s; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity:.9;} 50% { transform: scale(1.18); opacity:1;} }

  .status-title { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  .status-sub { font-size: 12px; color: var(--muted); }
  .iconbtn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel-alt); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .iconbtn.on { color: var(--cyan); }

  .section-label { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .amber-label { color: var(--amber); }
  .cyan-label { color: var(--cyan); }

  #briefingText { font-size: 14px; line-height: 1.55; color: var(--muted); min-height: 40px; white-space: pre-wrap; }
  .brief-btn { font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--amber-dim); background: transparent; color: var(--amber); }
  .brief-stats { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:10px; padding-top:8px; border-top:1px solid var(--border); }

  .task-row { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; background:var(--panel-alt); border:1px solid var(--border); margin-bottom:6px; }
  .task-row.done { opacity:.5; }
  .task-row.overdue { border-color: var(--danger); }
  .task-check { width:18px; height:18px; border-radius:5px; border:1px solid var(--muted); background:transparent; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .task-check.checked { background: var(--cyan); border-color: var(--cyan); color:#08221E; }
  .task-title { font-size:13px; }
  .task-title.done { text-decoration: line-through; }
  .task-meta { font-size:11px; color:var(--muted); }
  .task-del { background:transparent; border:none; color:var(--muted); font-size:14px; }
  #addTaskBox { display:none; flex-direction:column; gap:6px; background:var(--panel-alt); padding:10px; border-radius:10px; border:1px solid var(--border); margin-bottom:8px; }
  #addTaskBox input { background:transparent; border:1px solid var(--border); border-radius:6px; padding:6px 8px; color:var(--text); font-size:13px; }
  #addTaskBox .row { display:flex; gap:6px; }
  #addTaskBox .row input { flex:1; }
  #addTaskBox button { align-self:flex-end; font-size:12px; padding:5px 12px; border-radius:6px; border:none; background:var(--cyan); color:#08221E; font-weight:600; }
  #taskList { max-height: 220px; overflow-y: auto; }

  #chatCard { display:flex; flex-direction:column; height: 420px; padding:0; }
  #chatHeader { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border); }
  #chatMessages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .bubble { max-width: 80%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .bubble.user { align-self: flex-end; background: rgba(44,122,112,.2); border: 1px solid var(--cyan-dim); }
  .bubble.assistant { align-self: flex-start; background: var(--panel-alt); border: 1px solid var(--border); }
  #chatInputRow { display:flex; align-items:center; gap:8px; padding:12px; border-top:1px solid var(--border); }
  #chatInputRow input { flex:1; background: var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:9px 13px; color:var(--text); font-size:14px; outline:none; }
  .sendbtn { width:38px; height:38px; border-radius:10px; border:none; background:var(--amber); color:#241704; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; }
  .micbtn { width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--panel-alt); color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; }
  .micbtn.on { color: var(--cyan); border-color: var(--cyan); background: rgba(79,217,199,.13); }
  #helpBtn { font-size: 11px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card header">
    <div class="header-top">
      <div class="orb-wrap" id="orb"><div class="orb-ring1"></div><div class="orb-ring2"></div><div class="orb-core"></div></div>
      <div style="flex:1; min-width:0;">
        <div class="display status-title">JARVIS</div>
        <div class="mono status-sub" id="statusText">standing by</div>
      </div>
      <div class="header-icons">
        <button class="iconbtn" id="briefIcon" onclick="toggleBriefingPanel()" title="Daily briefing">📡</button>
        <button class="iconbtn on" id="voiceToggle" onclick="toggleVoiceOut()">🔊</button>
        <button class="iconbtn" id="notifToggle" onclick="toggleNotifications()" title="Enable reminders">🔔</button>
      </div>
    </div>
    <div class="header-time-row mono">
      <span id="dateText">---</span>
      <span id="timeText" style="color:var(--text); font-size:14px;">--:--</span>
    </div>
  </div>

  <div class="card" id="briefingPanel" style="display:none;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <div class="display amber-label section-label" style="margin-bottom:0;">Daily Briefing</div>
      <button class="brief-btn" onclick="getBriefing()">✨ Refresh</button>
    </div>
    <div id="briefingText">Tap the 📡 icon any time for a rundown of what's due and what to tackle first.</div>
    <div class="brief-stats mono">
      <span>OPEN: <span id="openCount" style="color:var(--text)">0</span></span>
      <span>OVERDUE: <span id="overdueCount" style="color:var(--text)">0</span></span>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <div class="display cyan-label section-label" style="margin-bottom:0;">Tasks &amp; Projects</div>
      <div style="display:flex; gap:6px;">
        <button class="iconbtn" onclick="exportData()" title="Backup to file">⬇</button>
        <button class="iconbtn" onclick="document.getElementById('importFile').click()" title="Restore from file">⬆</button>
        <button class="iconbtn" onclick="toggleAddTask()">+</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(event)" />
    <div id="addTaskBox">
      <input id="newTaskTitle" placeholder="Task (e.g. Draft lit review)" />
      <div class="row">
        <input id="newTaskCourse" placeholder="Course/project" />
        <input id="newTaskDue" type="date" class="mono" />
      </div>
      <button onclick="addTask()">Add</button>
    </div>
    <div id="taskList" class="scroll"></div>
  </div>

  <div class="card" id="chatCard">
    <div id="chatHeader">
      <div class="display section-label" style="margin-bottom:0; color:var(--text);">📘 Console</div>
      <button id="helpBtn" onclick="showHelp()">? commands</button>
    </div>
    <div id="chatMessages" class="scroll"></div>
    <div id="attachPreview" class="hidden" style="display:flex; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid var(--border); font-size:12px; color:var(--muted);">
      <span id="attachPreviewName">file attached</span>
      <button onclick="clearAttachment()" style="background:transparent; border:none; color:var(--muted); font-size:13px; margin-left:auto;">✕ remove</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleAttachment(event)" />
    <input type="file" id="fileInput" accept="image/*,.txt,.md" style="display:none" onchange="handleAttachment(event)" />
    <div id="chatInputRow">
      <button class="micbtn" id="micBtn" onclick="toggleListen()">🎤</button>
      <button class="micbtn" onclick="document.getElementById('cameraInput').click()" title="Take a photo">📷</button>
      <button class="micbtn" onclick="document.getElementById('fileInput').click()" title="Attach a file">📎</button>
      <input id="chatInput" placeholder="Ask me anything, or speak a command…" onkeydown="if(event.key==='Enter') sendCommand();" />
      <button class="sendbtn" onclick="sendCommand()">➤</button>
    </div>
  </div>
</div>

<script>
// ---------- storage ----------
const LS_TASKS = 'jarvis_tasks';
const LS_MSGS = 'jarvis_messages_ai';
let tasks = JSON.parse(localStorage.getItem(LS_TASKS) || '[]');
let messages = JSON.parse(localStorage.getItem(LS_MSGS) || 'null') || [
  { role: 'assistant', content: "At your service, sir. Systems nominal, task ledger loaded, and I'm ready whenever you are." }
];

const SYSTEM_BASE = `You are JARVIS, Tony Stark's AI in tone and manner — impeccably composed, dryly witty, quietly brilliant, and utterly unflappable no matter what's asked. You speak like a very sharp British butler crossed with a genius engineer: precise, a little formal, occasional understated humor, never gushing or overly enthusiastic.
Address the user as "sir" naturally but sparingly (not in every reply — maybe one in three). Never use markdown headers or bullet lists in conversation; speak in flowing, natural sentences, 2-6 sentences unless more detail is requested.
If a request is academic or research-oriented, drop the wit and be precise, thorough, and flag any uncertainty clearly.
Keep every reply short enough to be spoken aloud naturally.`;

let pendingAttachment = null; // { dataUrl, name, kind: 'image'|'text', textContent }

async function askAI(userText, imageDataUrl) {
  setOrb('thinking');
  try {
    let response;
    if (imageDataUrl) {
      response = await puter.ai.chat(
        SYSTEM_BASE + "\n\nUser: " + userText,
        imageDataUrl,
        { model: 'claude-sonnet-5' }
      );
    } else {
      response = await puter.ai.chat(
        SYSTEM_BASE + "\n\nUser: " + userText,
        { model: 'claude-sonnet-5' }
      );
    }
    const text = (typeof response === 'string') ? response : (response?.message?.content?.[0]?.text || response?.toString?.() || "I'm drawing a blank on that one.");
    return text;
  } catch (e) {
    return "I couldn't reach the AI service just now (" + (e?.message || 'connection issue') + "). Try again in a moment.";
  }
}

function handleAttachment(event) {
  const file = event.target.files[0];
  if (!file) return;
  const isText = /\.(txt|md)$/i.test(file.name) || file.type === 'text/plain';
  const readerObj = new FileReader();
  readerObj.onload = (e) => {
    if (isText) {
      pendingAttachment = { name: file.name, kind: 'text', textContent: e.target.result };
    } else {
      pendingAttachment = { name: file.name, kind: 'image', dataUrl: e.target.result };
    }
    document.getElementById('attachPreviewName').textContent = '📎 ' + file.name;
    document.getElementById('attachPreview').classList.remove('hidden');
    document.getElementById('attachPreview').style.display = 'flex';
  };
  if (isText) readerObj.readAsText(file); else readerObj.readAsDataURL(file);
  event.target.value = '';
}

function clearAttachment() {
  pendingAttachment = null;
  document.getElementById('attachPreview').style.display = 'none';
}

function persistTasks() { localStorage.setItem(LS_TASKS, JSON.stringify(tasks)); }
function persistMessages() { localStorage.setItem(LS_MSGS, JSON.stringify(messages)); }

let voiceOut = true;
let orbState = 'idle';

// ---------- orb / clock ----------
function setOrb(state) {
  orbState = state;
  const orb = document.getElementById('orb');
  orb.className = 'orb-wrap' + (state !== 'idle' ? ' ' + state : '');
  const labels = { idle: 'standing by', listening: 'listening…', speaking: 'speaking…', thinking: 'thinking…' };
  document.getElementById('statusText').textContent = labels[state] || 'standing by';
}
function updateClock() {
  const now = new Date();
  document.getElementById('timeText').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  document.getElementById('dateText').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
setInterval(updateClock, 30000);

function toggleVoiceOut() {
  voiceOut = !voiceOut;
  const btn = document.getElementById('voiceToggle');
  btn.textContent = voiceOut ? '🔊' : '🔈';
  btn.className = 'iconbtn' + (voiceOut ? ' on' : '');
}

// ---------- reminders / notifications (best-effort, works while app is open/recent) ----------
const LS_NOTIF_LOG = 'jarvis_notif_log'; // { "2026-08-26": ["taskid1","taskid2"] }

function notifSupported() {
  return 'Notification' in window;
}

function toggleNotifications() {
  if (!notifSupported()) {
    reply("This browser doesn't support notifications, boss. Chrome on Android works best for this.");
    return;
  }
  if (Notification.permission === 'granted') {
    reply("Reminders are already on. I'll flag anything due whenever you open me.");
    checkAndNotify(true);
    return;
  }
  Notification.requestPermission().then(perm => {
    updateNotifBtn();
    if (perm === 'granted') {
      reply("Reminders are on. Heads up: this only works reliably while I'm open or recently used — not a guaranteed alarm if the app's been closed a long time. For anything critical, ask me to set a real phone alarm instead.");
      new Notification('Jarvis reminders active', { body: "I'll flag due tasks whenever you open me." });
      checkAndNotify(true);
    } else {
      reply("No worries — reminders stay off. You can turn them on any time from the bell icon.");
    }
  });
}

function updateNotifBtn() {
  const btn = document.getElementById('notifToggle');
  if (!btn) return;
  const on = notifSupported() && Notification.permission === 'granted';
  btn.className = 'iconbtn' + (on ? ' on' : '');
  btn.textContent = on ? '🔔' : '🔕';
}

function checkAndNotify(force) {
  if (!notifSupported() || Notification.permission !== 'granted') return;
  const todayKey = new Date().toDateString();
  let log = {};
  try { log = JSON.parse(localStorage.getItem(LS_NOTIF_LOG) || '{}'); } catch (e) {}
  const seenToday = new Set(log[todayKey] || []);
  const today0 = new Date(todayKey);

  const dueOrOverdue = tasks.filter(t => !t.done && t.due && new Date(t.due) <= today0);
  const toNotify = force ? dueOrOverdue : dueOrOverdue.filter(t => !seenToday.has(t.id));

  toNotify.forEach(t => {
    const overdue = new Date(t.due) < today0;
    new Notification(overdue ? '⚠️ Overdue: ' + t.title : '📌 Due today: ' + t.title, {
      body: t.course ? t.course : 'Tap Jarvis to review your list.',
      tag: t.id
    });
    seenToday.add(t.id);
  });

  log[todayKey] = Array.from(seenToday);
  // keep log small: only last 7 days
  const keys = Object.keys(log).sort();
  while (keys.length > 7) { delete log[keys.shift()]; }
  localStorage.setItem(LS_NOTIF_LOG, JSON.stringify(log));
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkAndNotify(false);
});
function speak(text) {
  if (!voiceOut || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.02; utter.pitch = 0.85;
  utter.onstart = () => setOrb('speaking');
  utter.onend = () => setOrb('idle');
  window.speechSynthesis.speak(utter);
}

// ---------- speech recognition ----------
let recognition = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('chatInput').value = transcript;
    setOrb('idle');
    document.getElementById('micBtn').classList.remove('on');
    setTimeout(() => sendCommand(), 150);
  };
  recognition.onerror = () => { setOrb('idle'); document.getElementById('micBtn').classList.remove('on'); };
  recognition.onend = () => { if (orbState === 'listening') setOrb('idle'); document.getElementById('micBtn').classList.remove('on'); };
} else {
  document.addEventListener('DOMContentLoaded', () => { document.getElementById('micBtn').style.display = 'none'; });
}
function toggleListen() {
  if (!recognition) return;
  const btn = document.getElementById('micBtn');
  if (orbState === 'listening') {
    recognition.stop(); setOrb('idle'); btn.classList.remove('on');
  } else {
    try { recognition.start(); setOrb('listening'); btn.classList.add('on'); } catch (e) {}
  }
}

// ---------- template briefing engine ----------
// ---------- weather (free, no API key — Open-Meteo) ----------
const WMO_CODES = {
  0: 'clear skies', 1: 'mostly clear', 2: 'partly cloudy', 3: 'overcast',
  45: 'foggy', 48: 'foggy with frost', 51: 'light drizzle', 53: 'drizzle', 55: 'heavy drizzle',
  61: 'light rain', 63: 'rain', 65: 'heavy rain', 71: 'light snow', 73: 'snow', 75: 'heavy snow',
  80: 'rain showers', 81: 'heavy rain showers', 82: 'violent rain showers',
  95: 'thunderstorms', 96: 'thunderstorms with hail', 99: 'severe thunderstorms with hail'
};

async function getWeather(cityName) {
  setOrb('thinking');
  try {
    let lat, lon, place;
    if (cityName) {
      const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1`).then(r => r.json());
      if (!geo.results || !geo.results.length) { reply(`I couldn't locate "${cityName}", sir. Try a different spelling?`); setOrb('idle'); return; }
      lat = geo.results[0].latitude; lon = geo.results[0].longitude;
      place = [geo.results[0].name, geo.results[0].admin1, geo.results[0].country].filter(Boolean).join(', ');
    } else if (navigator.geolocation) {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 6000 }));
      lat = pos.coords.latitude; lon = pos.coords.longitude;
      place = 'your location';
    } else {
      reply("I'll need a city name, sir — say something like \"weather in Chennai.\"");
      setOrb('idle'); return;
    }
    const data = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,relative_humidity_2m&temperature_unit=celsius`).then(r => r.json());
    const cur = data.current;
    const desc = WMO_CODES[cur.weather_code] || 'conditions I can\'t quite classify';
    const text = `It's ${Math.round(cur.temperature_2m)}°C in ${place} right now, sir — ${desc}, humidity around ${cur.relative_humidity_2m}%.`;
    reply(text);
  } catch (e) {
    reply("Couldn't pull live weather just now — signal or location access might be the issue. Try again in a moment, or give me a specific city name.");
  }
  if (!voiceOut) setOrb('idle');
}


  "One thing at a time, sir — you've managed worse odds.",
  "Nothing here you're not equipped to handle.",
  "Steady progress, as ever, wins the day.",
  "You've more time than it feels like. Use it wisely.",
  "Small steps today spare you the scramble tomorrow."
];
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

function buildBriefing() {
  const now = new Date();
  const today0 = new Date(now.toDateString());
  const hour = now.getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const pending = tasks.filter(t => !t.done);
  const overdue = pending.filter(t => t.due && new Date(t.due) < today0);
  const dueToday = pending.filter(t => t.due && new Date(t.due).toDateString() === today0.toDateString());
  const dueSoon = pending.filter(t => {
    if (!t.due) return false;
    const d = daysBetween(today0, new Date(t.due));
    return d > 0 && d <= 3;
  });

  let lines = [`${greeting}. It's ${now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}.`];

  if (overdue.length) {
    lines.push(`${overdue.length} item${overdue.length > 1 ? 's are' : ' is'} overdue: ${overdue.map(t => t.title).join(', ')}. Deal with ${overdue.length > 1 ? 'these' : 'this'} first.`);
  }
  if (dueToday.length) {
    lines.push(`Due today: ${dueToday.map(t => t.title).join(', ')}.`);
  }
  if (dueSoon.length) {
    lines.push(`Coming up in the next few days: ${dueSoon.map(t => `${t.title} (${t.due})`).join(', ')}.`);
  }
  if (!overdue.length && !dueToday.length && !dueSoon.length) {
    lines.push(pending.length ? "Nothing urgent in the next few days — good window to get ahead on something." : "Your list is clear. Good time to add what's coming up, or just enjoy the calm.");
  }
  lines.push(ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)]);
  return lines.join(' ');
}

function toggleBriefingPanel() {
  const panel = document.getElementById('briefingPanel');
  const icon = document.getElementById('briefIcon');
  const opening = panel.style.display === 'none';
  panel.style.display = opening ? 'block' : 'none';
  icon.className = 'iconbtn' + (opening ? ' on' : '');
  if (opening) getBriefing();
}

function getBriefing() {
  const text = buildBriefing();
  document.getElementById('briefingText').textContent = text;
  document.getElementById('briefingText').style.color = 'var(--text)';
  speak(text);
}

// ---------- command parser (no AI, keyword-based) ----------
function renderMessages() {
  const el = document.getElementById('chatMessages');
  el.innerHTML = '';
  messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'bubble ' + (m.role === 'user' ? 'user' : 'assistant');
    div.textContent = m.content;
    el.appendChild(div);
  });
  el.scrollTop = el.scrollHeight;
}
function reply(text) {
  messages.push({ role: 'assistant', content: text });
  renderMessages(); persistMessages();
  speak(text);
}
function showHelp() {
  reply('At your disposal: "add task [name]", "my tasks", "complete [name]", "delete [name]", "briefing", "weather" or "weather in [city]", "enable reminders", "backup", "what time is it". Tap 📷 or 📎 to show me a photo or file — I can read it. Anything beyond that — ask away, sir, I\'ll give it proper thought.');
}
function findTaskByFuzzyTitle(text) {
  const t = text.toLowerCase();
  return tasks.find(task => t.includes(task.title.toLowerCase()));
}

function sendCommand() {
  const input = document.getElementById('chatInput');
  const raw = input.value.trim();
  const attachment = pendingAttachment;

  if (!raw && !attachment) return;

  const displayText = raw || (attachment ? `[attached: ${attachment.name}]` : '');
  messages.push({ role: 'user', content: displayText });
  input.value = '';
  clearAttachment();
  renderMessages(); persistMessages();

  // an attachment always routes straight to the AI — images or text files aren't "commands"
  if (attachment) {
    const prompt = raw || (attachment.kind === 'image' ? "What's in this image? Help me understand or work through it." : "Here's a file I need help with.");
    if (attachment.kind === 'image') {
      askAI(prompt, attachment.dataUrl).then(text => { reply(text); if (!voiceOut) setOrb('idle'); });
    } else {
      const combined = prompt + `\n\n--- Attached file: ${attachment.name} ---\n${attachment.textContent}`;
      askAI(combined).then(text => { reply(text); if (!voiceOut) setOrb('idle'); });
    }
    return;
  }

  const t = raw.toLowerCase();

  if (/^help$|what can you do|commands/.test(t)) { showHelp(); return; }

  if (/enable (reminders|notifications)|turn on (reminders|notifications)|remind me/.test(t)) { toggleNotifications(); return; }

  if (/^backup|^export/.test(t)) { exportData(); return; }

  if (/^add task|^add /.test(t)) {
    let title = raw.replace(/^add task/i, '').replace(/^add/i, '').trim();
    let due = null;
    const dueMatch = title.match(/due (\d{4}-\d{2}-\d{2})/i);
    if (dueMatch) { due = dueMatch[1]; title = title.replace(dueMatch[0], '').trim(); }
    if (!title) { reply("What's the task called, boss?"); return; }
    tasks.push({ id: 't_' + Date.now(), title, course: '', due, done: false });
    tasks.sort((a, b) => { if (!a.due) return 1; if (!b.due) return -1; return new Date(a.due) - new Date(b.due); });
    persistTasks(); renderTasks();
    reply(`"${title}" is on the list${due ? ', due ' + due : ''}. Consider it tracked, sir.`);
    return;
  }

  if (/my tasks|what's open|whats open|list tasks|show tasks/.test(t)) {
    const pending = tasks.filter(x => !x.done);
    if (!pending.length) { reply("Nothing outstanding, sir. Rather refreshing, isn't it?"); return; }
    reply('Currently open: ' + pending.map(x => x.title + (x.due ? ` (due ${x.due})` : '')).join('; ') + '.');
    return;
  }

  if (/^complete |^done |^finish |mark .* done/.test(t)) {
    const match = findTaskByFuzzyTitle(raw);
    if (match) { toggleTaskDone(match.id); reply(`"${match.title}" — done. One less thing, sir.`); }
    else { reply("I can't locate that one on your list. Perhaps double-check the wording?"); }
    return;
  }

  if (/^delete |^remove /.test(t)) {
    const match = findTaskByFuzzyTitle(raw);
    if (match) { deleteTask(match.id); reply(`"${match.title}" has been struck from the record.`); }
    else { reply("Couldn't find that task to remove, sir."); }
    return;
  }

  if (/briefing|brief me/.test(t)) {
    const text = buildBriefing();
    document.getElementById('briefingText').textContent = text;
    document.getElementById('briefingText').style.color = 'var(--text)';
    reply(text);
    return;
  }

  if (/weather|temperature|temp on|forecast/.test(t)) {
    const cityMatch = raw.match(/(?:in|on|for|at)\s+([a-zA-Z\s]+)$/i);
    const city = cityMatch ? cityMatch[1].trim() : null;
    getWeather(city);
    return;
  }

  if (/what time/.test(t)) { reply('It is ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ', sir.'); return; }
  if (/what.*date|today's date/.test(t)) { reply('Today is ' + new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) + '.'); return; }

  // fall through to real AI for anything else
  askAI(raw).then(text => { reply(text); if (!voiceOut) setOrb('idle'); });
}

// ---------- backup / restore ----------
function exportData() {
  const payload = {
    exportedAt: new Date().toISOString(),
    tasks: tasks,
    messages: messages
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `jarvis-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  reply("Backup saved to your downloads. Keep that file somewhere safe — it's the only copy outside this phone.");
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const readerObj = new FileReader();
  readerObj.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.tasks)) throw new Error('Not a valid Jarvis backup file.');
      const proceed = confirm(`This backup has ${data.tasks.length} task(s) from ${data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'an earlier export'}. Restoring will replace your current tasks and chat history. Continue?`);
      if (!proceed) return;
      tasks = data.tasks || [];
      messages = data.messages || messages;
      persistTasks(); persistMessages();
      renderTasks(); renderMessages();
      reply("Backup restored. Your tasks and chat history are back.");
    } catch (err) {
      alert("Couldn't read that file: " + err.message);
    }
  };
  readerObj.readAsText(file);
  event.target.value = '';
}

// ---------- tasks ----------
function toggleAddTask() {
  const box = document.getElementById('addTaskBox');
  box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
}
function addTask() {
  const title = document.getElementById('newTaskTitle').value.trim();
  if (!title) return;
  const course = document.getElementById('newTaskCourse').value.trim();
  const due = document.getElementById('newTaskDue').value;
  tasks.push({ id: 't_' + Date.now(), title, course, due: due || null, done: false });
  tasks.sort((a, b) => { if (!a.due) return 1; if (!b.due) return -1; return new Date(a.due) - new Date(b.due); });
  persistTasks(); renderTasks();
  document.getElementById('newTaskTitle').value = '';
  document.getElementById('newTaskCourse').value = '';
  document.getElementById('newTaskDue').value = '';
  document.getElementById('addTaskBox').style.display = 'none';
}
function toggleTaskDone(id) {
  tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
  persistTasks(); renderTasks();
}
function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  persistTasks(); renderTasks();
}
function renderTasks() {
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  const today0 = new Date(new Date().toDateString());
  if (tasks.length === 0) {
    list.innerHTML = '<div style="color:var(--muted); font-size:13px;">No tasks logged. Add your first assignment.</div>';
  } else {
    tasks.forEach(t => {
      const isOverdue = !t.done && t.due && new Date(t.due) < today0;
      const row = document.createElement('div');
      row.className = 'task-row' + (t.done ? ' done' : '') + (isOverdue ? ' overdue' : '');
      row.innerHTML = `
        <button class="task-check${t.done ? ' checked' : ''}" onclick="toggleTaskDone('${t.id}')">${t.done ? '✓' : ''}</button>
        <div style="flex:1; min-width:0;">
          <div class="task-title${t.done ? ' done' : ''}">${escapeHtml(t.title)}</div>
          <div class="task-meta mono">${[t.course, t.due].filter(Boolean).map(escapeHtml).join(' · ')}</div>
        </div>
        <button class="task-del" onclick="deleteTask('${t.id}')">🗑</button>`;
      list.appendChild(row);
    });
  }
  const pending = tasks.filter(t => !t.done);
  document.getElementById('openCount').textContent = pending.length;
  const overdue = pending.filter(t => t.due && new Date(t.due) < today0).length;
  document.getElementById('overdueCount').textContent = overdue;
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ---------- boot ----------
updateClock();
renderTasks();
renderMessages();
updateNotifBtn();
if (notifSupported() && Notification.permission === 'granted') checkAndNotify(false);

// brief boot sequence on the status line (cosmetic, once per page load)
(function bootSequence() {
  const el = document.getElementById('statusText');
  if (!el) return;
  const seq = ['initializing…', 'all systems nominal', 'standing by'];
  let i = 0;
  const step = () => {
    if (orbState !== 'idle') return; // don't override real activity
    el.textContent = seq[i];
    i++;
    if (i < seq.length) setTimeout(step, 650);
  };
  step();
})();
</script>
